<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071320; --panel:#0d1f31; --line:#1b3a57; --text:#e4f1fb; --muted:#7f9bb3;
  --core:#4fd8ff; --warm:#ffb23e; --me:#12385a;
  --head:'Chakra Petch',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif;
}
:root[data-theme="light"]{
  --bg:#eef4f9; --panel:#ffffff; --line:#c9d9e6; --text:#0d2236; --muted:#5a7388;
  --core:#0a86b8; --warm:#c97a00; --me:#d6ebf8;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.55 var(--body);
  background-image:radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--core) 14%,transparent),transparent 60%);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--core);outline-offset:2px}

.app{display:grid;grid-template-rows:auto auto 1fr auto;height:100%;max-width:820px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
h1{font:600 22px var(--head);letter-spacing:.14em}
.bar{display:flex;gap:8px;align-items:center}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--muted);font-size:14px}
.ghost:hover{color:var(--text);border-color:var(--core)}
.ghost[aria-pressed="true"]{color:var(--core);border-color:var(--core)}

/* the one memorable thing: the arc reactor */
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:4px 0 14px}
.reactor{position:relative;width:132px;height:132px;border-radius:50%;border:0;background:none;cursor:pointer}
.reactor .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--core);opacity:.9}
.reactor .ring.r2{inset:14px;border-style:dashed;border-width:2px;opacity:.6;animation:spin 14s linear infinite}
.reactor .ring.r3{inset:30px;border-color:var(--core);opacity:.35}
.reactor .core{position:absolute;inset:44px;border-radius:50%;background:var(--core);
  box-shadow:0 0 28px var(--core),0 0 60px color-mix(in srgb,var(--core) 50%,transparent);animation:pulse 3.2s ease-in-out infinite}
.reactor svg{position:absolute;inset:44px;width:44px;height:44px;fill:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(.88);opacity:.85}}
body[data-state="listening"]{--core:var(--warm)}
body[data-state="listening"] .core{animation-duration:.9s}
body[data-state="thinking"] .ring.r2{animation-duration:1.6s}
.status{color:var(--muted);font-size:14px;min-height:22px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--core)}

.chat{overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 2px 16px;scroll-behavior:smooth}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{background:var(--panel);border-top-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--me);border-top-right-radius:4px;align-self:flex-end}
.msg.typing{color:var(--muted)}

form.send{display:flex;gap:8px;padding:12px 0 16px}
form.send input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
form.send input:focus{border-color:var(--core);outline:none}
.go{background:var(--core);color:var(--bg);border:0;border-radius:10px;padding:0 20px;font:600 15px var(--head);cursor:pointer}
.mic{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:48px;cursor:pointer;font-size:18px}
.mic:hover{border-color:var(--warm)}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(3,10,18,.65)}
dialog h2{font:600 18px var(--head);margin-bottom:12px}
dialog label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
dialog input,dialog textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
dialog textarea{min-height:100px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.row .go{padding:9px 18px}

@media (max-width:520px){.msg{max-width:92%}.reactor{width:104px;height:104px}.reactor .core,.reactor svg{inset:34px;width:36px;height:36px}.reactor .ring.r2{inset:11px}.reactor .ring.r3{inset:23px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-state="idle">
<div class="app">
  <header>
    <h1>JARVIS</h1>
    <div class="bar">
      <button class="ghost" id="speakBtn" aria-pressed="true" title="Speak replies aloud">Voice replies</button>
      <button class="ghost" id="emailBtn">Email</button>
      <button class="ghost" id="themeBtn" aria-label="Switch theme">Theme</button>
      <button class="ghost" id="clearBtn">Clear</button>
    </div>
  </header>

  <section class="hero">
    <button class="reactor" id="reactor" aria-label="Speak to Jarvis">
      <span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span><span class="core"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>
    <div class="status" id="status" role="status">Tap the core to speak, or type below.</div>
  </section>

  <div style="display:grid;grid-template-rows:auto 1fr;min-height:0">
    <div class="chips" id="chips"></div>
    <main class="chat" id="chat" aria-live="polite"></main>
  </div>

  <form class="send" id="form">
    <button type="button" class="mic" id="mic" aria-label="Speak">🎤</button>
    <input id="input" placeholder="Ask anything or give a command" autocomplete="off" aria-label="Command">
    <button class="go" type="submit">Send</button>
  </form>
</div>

<dialog id="emailDlg">
  <form method="dialog" id="emailForm">
    <h2>Send an email</h2>
    <label for="eTo">To</label><input id="eTo" type="email" required>
    <label for="eSub">Subject</label><input id="eSub" required>
    <label for="eBody">Message</label><textarea id="eBody" required></textarea>
    <div class="row">
      <button type="button" class="ghost" id="eCancel">Cancel</button>
      <button type="submit" class="go">Send email</button>
    </div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), statusEl = $('status');
const GREETING = 'Jarvis is online. How can I help you?';
const QUICK = {'🕒 Time':'what time is it','😄 Joke':'tell me a joke','📸 Screenshot':'take a screenshot','🔋 Battery':'battery','💻 CPU usage':'cpu usage'};
let speak = true, busy = false;

function setState(s, text){ document.body.dataset.state = s; statusEl.textContent = text; }
function add(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'me' ? 'me' : 'bot');
  d.textContent = text; chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight; return d;
}
async function post(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {})});
  return r.json();
}
async function send(text){
  if (!text || busy) return;
  busy = true; add('me', text);
  const t = add('bot', 'Thinking…'); t.classList.add('typing');
  setState('thinking', 'Thinking…');
  try { t.textContent = (await post('/api/command', {text, speak})).reply; }
  catch { t.textContent = 'Cannot reach the JARVIS server. Is server.py still running?'; }
  t.classList.remove('typing');
  setState('idle', 'Tap the core to speak, or type below.');
  busy = false;
}
async function listen(){
  if (busy) return;
  busy = true; setState('listening', 'Listening… speak now');
  try {
    const {text} = await post('/api/listen');
    busy = false;
    if (text) send(text); else setState('idle', 'I didn’t catch that. Tap the core and try again.');
  } catch { busy = false; setState('idle', 'Cannot reach the JARVIS server.'); }
}

$('form').onsubmit = e => { e.preventDefault(); const v = $('input').value.trim(); $('input').value = ''; send(v); };
$('reactor').onclick = $('mic').onclick = listen;
$('clearBtn').onclick = () => { chat.innerHTML = ''; add('bot', GREETING); };
$('speakBtn').onclick = e => { speak = !speak; e.currentTarget.setAttribute('aria-pressed', speak); };
$('themeBtn').onclick = () => {
  const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('jarvis-theme', r.dataset.theme); } catch {}
};
try { const th = localStorage.getItem('jarvis-theme'); if (th) document.documentElement.dataset.theme = th; } catch {}

for (const [label, cmd] of Object.entries(QUICK)){
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = label;
  b.onclick = () => send(cmd); $('chips').appendChild(b);
}

const dlg = $('emailDlg');
$('emailBtn').onclick = () => dlg.showModal();
$('eCancel').onclick = () => dlg.close();
$('emailForm').onsubmit = async e => {
  e.preventDefault(); dlg.close();
  const body = {to:$('eTo').value, subject:$('eSub').value, body:$('eBody').value};
  setState('thinking', 'Sending email…');
  try { const r = await post('/api/email', body); add('bot', r.reply); $('emailForm').reset(); }
  catch { add('bot', 'Failed to send the email.'); }
  setState('idle', 'Tap the core to speak, or type below.');
};

add('bot', GREETING);
</script>
</body>
</html>
